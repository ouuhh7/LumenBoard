name: Native validator and rootless package

on:
  push:
    branches:
      - work/tendies-native-validation
  pull_request:
    branches:
      - work/tendies-native-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native XCTest project
        run: xcodegen generate --spec project.yml
      - name: Execute Objective-C XCTest suite
        run: |
          set -o pipefail
          xcodebuild test -project LumenBoardNativeTests.xcodeproj \
            -scheme LumenBoardNativeTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | tee native-xctest.log
          grep -E "Executed [0-9]+ tests|TEST SUCCEEDED" native-xctest.log
      - name: Upload XCTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-xctest-log
          path: native-xctest.log
          if-no-files-found: warn

  rootless-package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          export THEOS="$HOME/theos"
          "$THEOS/bin/update-theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Install patched iOS 16.5 SDK with private framework stubs
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos-sdks"
          git -C "$HOME/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$HOME/theos-sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"
          SDK="$HOME/theos/sdks/iPhoneOS16.5.sdk"
          test -d "$SDK"
          find "$SDK" -maxdepth 12 -path '*Preferences.framework*' -print | tee private-frameworks.txt
          test -n "$(find "$SDK" -maxdepth 12 -path '*Preferences.framework*' -type f -print -quit)"
          echo "Using patched Theos SDK $SDK"
      - name: Validate maintainer scripts and launch daemon plist
        run: |
          set -euo pipefail
          sh -n layout/DEBIAN/postinst
          sh -n layout/DEBIAN/prerm
          plutil -lint layout/Library/LaunchDaemons/com.iuyghi.lumenboardd.plist
          grep -q "/var/jb/usr/libexec/lumenboardd" layout/Library/LaunchDaemons/com.iuyghi.lumenboardd.plist
      - name: Build rootless package
        run: |
          export THEOS="$HOME/theos"
          export _THEOS_PLATFORM_DPKG_DEB=dpkg-deb
          make clean
          make package FINALPACKAGE=1
      - name: Verify Debian package
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | tee package-contents.txt
          dpkg-deb -f "$DEB" Package Version Architecture Depends | tee package-control.txt
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64"
          grep -q "var/jb/Library/PreferenceBundles/LumenBoardPrefs.bundle" package-contents.txt
          grep -q "var/jb/usr/libexec/lumenboardd" package-contents.txt
          grep -q "var/jb/Library/LaunchDaemons/com.iuyghi.lumenboardd.plist" package-contents.txt
          dpkg-deb -x "$DEB" extracted-deb
          test -x extracted-deb/var/jb/usr/libexec/lumenboardd
          plutil -lint extracted-deb/var/jb/Library/LaunchDaemons/com.iuyghi.lumenboardd.plist
          shasum -a 256 "$DEB" | tee SHA256SUMS
      - name: Upload package and verification
        uses: actions/upload-artifact@v4
        with:
          name: lumenboard-rootless-package
          path: |
            packages/*.deb
            package-contents.txt
            package-control.txt
            SHA256SUMS
