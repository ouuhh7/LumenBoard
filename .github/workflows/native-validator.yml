name: Native validator and rootless package

on:
  push:
    branches:
      - work/tendies-native-validation
      - fix/rootless-deb-installation
  pull_request:
    branches:
      - work/tendies-native-validation
      - fix/rootless-deb-installation
  workflow_dispatch:

# Keep only the newest validation run for a branch; older commits are superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run portable tools and adversarial archive tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m compileall -q tools tests
          bash -n tools/build_and_verify_deb.sh
          bash -n tools/normalize_deb_ownership.sh
          python tools/tendies_inspect.py --help >/dev/null
          python tools/static_wallpaper_builder.py --help >/dev/null
          python tools/descriptor_consistency.py --help >/dev/null
          python tools/static_descriptor_generator.py --help >/dev/null

  native-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native XCTest project
        run: xcodegen generate --spec project.yml
      - name: Execute Objective-C XCTest suite
        run: |
          set -o pipefail
          xcodebuild test -project LumenBoardNativeTests.xcodeproj \
            -scheme LumenBoardNativeTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | tee native-xctest.log
          grep -E "Executed [0-9]+ tests|TEST SUCCEEDED" native-xctest.log
      - name: Upload XCTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-xctest-log
          path: native-xctest.log
          if-no-files-found: warn

  rootless-package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          export THEOS="$HOME/theos"
          "$THEOS/bin/update-theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Install patched iOS 16.5 SDK with private framework stubs
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos-sdks"
          git -C "$HOME/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$HOME/theos-sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"
          SDK="$HOME/theos/sdks/iPhoneOS16.5.sdk"
          test -d "$SDK"
          find "$SDK" -maxdepth 12 -path '*Preferences.framework*' -print | tee private-frameworks.txt
          test -n "$(find "$SDK" -maxdepth 12 -path '*Preferences.framework*' -type f -print -quit)"
          echo "Using patched Theos SDK $SDK"
      - name: Validate maintainer scripts and launch daemon plist
        run: |
          set -euo pipefail
          sh -n layout/DEBIAN/postinst
          sh -n layout/DEBIAN/prerm
          sh tests/test_maintainer_scripts.sh
          plutil -lint layout/Library/LaunchDaemons/com.iuyghi.lumenboardd.plist
          grep -q "/var/jb/usr/libexec/lumenboardd" layout/Library/LaunchDaemons/com.iuyghi.lumenboardd.plist
          ! grep -Eq '/usr/bin/grep|/bin/sleep|bootstrap system|kickstart -k system' layout/DEBIAN/postinst layout/DEBIAN/prerm
          grep -q 'user/foreground/com.iuyghi.lumenboardd' layout/DEBIAN/postinst
          grep -q 'system/com.iuyghi.lumenboardd' layout/DEBIAN/postinst
          grep -q 'bootout "$LEGACY_SERVICE"' layout/DEBIAN/postinst
          grep -q 'bootstrap user/foreground' layout/DEBIAN/postinst
          grep -q 'service already bootstrapped' layout/DEBIAN/postinst
          grep -q 'bootstrap_status.*37' layout/DEBIAN/postinst
          grep -q 'LUMENBOARD_LAUNCHCTL' layout/DEBIAN/postinst
          grep -q 'user/foreground/com.iuyghi.lumenboardd' layout/DEBIAN/prerm
          grep -q 'system/com.iuyghi.lumenboardd' layout/DEBIAN/prerm
      - name: Build rootless package
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1
      - name: Verify Debian package
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          tools/normalize_deb_ownership.sh "$DEB"
          # Validate the ar/deb container before inspecting its payload.
          ar t "$DEB" | tee package-archive-members.txt
          grep -Fxq "debian-binary" package-archive-members.txt
          grep -Eq '^control\.tar\.(gz|xz|zst)$' package-archive-members.txt
          grep -Fxq "data.tar.xz" package-archive-members.txt
          test "$(ar p "$DEB" debian-binary)" = "2.0"

          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | tee package-contents.txt
          dpkg-deb -f "$DEB" Package Version Architecture Depends | tee package-control.txt
          test "$(dpkg-deb -f "$DEB" Package)" = "com.iuyghi.lumenboard"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.1.0-16"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$DEB" Depends)" = "firmware (>= 16.0), firmware (<< 17.0), preferenceloader"

          dpkg-deb -x "$DEB" extracted-deb
          dpkg-deb -e "$DEB" extracted-control
          BUNDLE="extracted-deb/var/jb/Library/PreferenceBundles/LumenBoardPrefs.bundle"
          INFO="$BUNDLE/Info.plist"
          PREFS="$BUNDLE/LumenBoardPrefs"
          DAEMON="extracted-deb/var/jb/usr/libexec/lumenboardd"
          LAUNCHD="extracted-deb/var/jb/Library/LaunchDaemons/com.iuyghi.lumenboardd.plist"

          # Regression guard: Preferences bundles without this plist are not loadable.
          test -f "$INFO"
          plutil -lint "$INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "com.iuyghi.lumenboard.preferences"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")" = "LumenBoardPrefs"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$INFO")" = "BNDL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSPrincipalClass' "$INFO")" = "LumenBoardRootListController"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "16"

          test -x "$PREFS"
          test -x "$DAEMON"
          file "$PREFS" | tee preference-binary-file.txt
          file "$DAEMON" | tee daemon-binary-file.txt
          grep -Eiq 'Mach-O.*arm64' preference-binary-file.txt
          grep -Eiq 'Mach-O.*arm64' daemon-binary-file.txt
          lipo "$PREFS" -verify_arch arm64
          lipo "$DAEMON" -verify_arch arm64
          otool -L "$PREFS" "$DAEMON" | tee macho-dependencies.txt
          otool -l "$PREFS" | grep -q "LC_CODE_SIGNATURE"
          otool -l "$DAEMON" | grep -q "LC_CODE_SIGNATURE"

          plutil -lint "$LAUNCHD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Label' "$LAUNCHD")" = "com.iuyghi.lumenboardd"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$LAUNCHD")" = "/var/jb/usr/libexec/lumenboardd"

          # Check the actual control archive scripts, not only the source copies.
          for script in postinst prerm; do
            test -x "extracted-control/$script"
            sh -n "extracted-control/$script"
          done

          python3 - <<'PY'
          import pathlib, stat, sys
          root = pathlib.Path("extracted-deb/var/jb")
          executable = {
              "usr/libexec/lumenboardd",
              "Library/PreferenceBundles/LumenBoardPrefs.bundle/LumenBoardPrefs",
          }
          if not root.is_dir():
              raise SystemExit("FAIL: rootless /var/jb payload is missing")
          for path in root.rglob("*"):
              if path.is_symlink():
                  raise SystemExit(f"FAIL: unexpected symlink in package: {path}")
              mode = stat.S_IMODE(path.stat().st_mode)
              relative = path.relative_to(root).as_posix()
              expected = 0o755 if path.is_dir() or relative in executable else 0o644
              if mode != expected:
                  raise SystemExit(f"FAIL: mode {mode:04o} != {expected:04o}: {path}")
              if path.stat().st_mode & (stat.S_ISUID | stat.S_ISGID | stat.S_IWGRP | stat.S_IWOTH):
                  raise SystemExit(f"FAIL: unsafe permission bits: {path}")
          print("PASS: rootless payload contains no symlinks or unsafe permissions")
          PY

          # Display names may conceal the macOS runner's numeric UID/GID.
          python3 tools/verify_deb_ownership.py "$DEB"

          shasum -a 256 "$DEB" | tee SHA256SUMS
          {
            echo "Package: $(dpkg-deb -f "$DEB" Package)"
            echo "Version: $(dpkg-deb -f "$DEB" Version)"
            echo "Architecture: $(dpkg-deb -f "$DEB" Architecture)"
            echo "SHA-256: $(shasum -a 256 "$DEB" | awk '{print $1}')"
            echo "Scope: archive, metadata, rootless paths, Mach-O architecture and LC_CODE_SIGNATURE load-command presence, bundle Info.plist, and control-script syntax verified"
            echo "Not verified: cryptographic Mach-O signature validity, entitlements, installation, or PosterBoard runtime on iPhone"
          } | tee package-verification.txt
      - name: Upload package and verification
        uses: actions/upload-artifact@v4
        with:
          name: lumenboard-rootless-package
          path: |
            packages/*.deb
            package-contents.txt
            package-control.txt
            SHA256SUMS
            package-archive-members.txt
            preference-binary-file.txt
            daemon-binary-file.txt
            macho-dependencies.txt
            package-verification.txt